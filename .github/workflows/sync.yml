name: Sync scripts to private repo

on:
  push:
    branches: [main]
    paths:
      - 'submissions/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: fengma-works/zhuti-01
          token: ${{ secrets.SYNC_TOKEN }}
          path: private-repo

      - name: Copy submissions to private repo
        run: |
          mkdir -p "private-repo/duanju-kit/剧本"
          rsync -av --exclude='把剧本放这里.txt' submissions/ "private-repo/duanju-kit/剧本/"

      - name: Commit and push
        run: |
          cd private-repo
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "自动同步投稿剧本"
          git push
